name: Ingest Location

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON payload: {"lat":52.08,"lon":5.06} plus optional "date" (ISO 8601)'
        required: true
        type: string
  repository_dispatch:
    types:
      - location-update

permissions:
  contents: write

concurrency:
  group: location-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ingest.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write location payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_PAYLOAD: ${{ github.event.inputs.payload }}
          REPOSITORY_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$REPOSITORY_PAYLOAD" > "$RUNNER_TEMP/location-payload.json"
          else
            printf '%s' "$WORKFLOW_PAYLOAD" > "$RUNNER_TEMP/location-payload.json"
          fi
          test -s "$RUNNER_TEMP/location-payload.json"

      - name: Ingest location
        id: ingest
        run: npm run ingest -- "$RUNNER_TEMP/location-payload.json"

      - name: Commit api.json
        if: steps.ingest.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: Finding Anand
          GIT_AUTHOR_EMAIL: bot@anandchowdhary.com
          GIT_COMMITTER_NAME: Finding Anand
          GIT_COMMITTER_EMAIL: bot@anandchowdhary.com
          GIT_AUTHOR_DATE: ${{ steps.ingest.outputs.date }}
          GIT_COMMITTER_DATE: ${{ steps.ingest.outputs.date }}
          COMMIT_MESSAGE: ${{ steps.ingest.outputs.message }}
        run: |
          git add api.json
          git commit -m "$COMMIT_MESSAGE"
          # main may have moved since checkout (e.g. a merged PR); replay on top.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report skipped update
        if: steps.ingest.outputs.changed != 'true'
        env:
          REASON: ${{ steps.ingest.outputs.reason }}
        run: |
          echo "Location update skipped: $REASON"

  publish:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/summarize.yml
